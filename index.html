<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Palworld Nyu Tools</title>
    <link rel="stylesheet" href="css/styles.css?v=0.7" />
    <script src="js/condensation-data.js?v=0.7" defer></script>
    <script src="js/app.js?v=0.7" defer></script>
  </head>
  <body>
    <header class="topbar">
