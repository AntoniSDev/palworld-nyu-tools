<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tableaux et outils pratiques en français pour Palworld." />
    <title>Palworld Nyu Tools</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="css/styles.css?v=0.9.31" />
    <script src="js/condensation-data.js?v=0.9" defer></script>
    <script src="js/egg-size-data.js?v=0.9.14" defer></script>
    <script src="js/breeding-data.js?v=0.9.1" defer></script>
    <script src="js/passive-data.js?v=0.9" defer></script>
    <script src="js/app.js?v=0.9.16" defer></script>
    <script src="js/carrier-breeding-solver.js?v=0.9.1" defer></script>
    <script src="js/save-cumoir.js?v=0.9.34" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Palworld Nyu Tools — accueil">
        <span class="brand__mark" aria-hidden="true">N</span>
        <span class="brand__name"><strong>Palworld</strong><b>Nyu Tools</b><small class="brand__version">v0.9</small></span>
      </a>
    </header>

    <nav class="site-nav" aria-label="Navigation principale">
      <div class="site-nav__inner">
        <button id="single-view" class="active" type="button">Aptitudes de travail</button>
        <div class="site-nav__group">
          <button id="skills-menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="skills-menu">
            Compétences <span class="site-nav__chevron" aria-hidden="true"></span>
          </button>
          <div id="skills-menu" class="site-nav__submenu" role="menu" aria-hidden="true">
            <button id="passive-view" type="button" role="menuitem">Passives</button>
            <button id="partner-view" type="button" role="menuitem">Utilitaires</button>
            <button id="combat-partner-view" type="button" role="menuitem">Combat</button>
          </div>
        </div>
        <button id="condensation-view" type="button">Condensation des Pals</button>
        <button id="breeding-view" type="button">Cumoir à Pals</button>
        <button id="memo-view" type="button">Mémo</button>
      </div>
    </nav>

    <main class="page-shell" id="top">
      <section class="intro">
        <div>
          <p id="page-eyebrow" class="eyebrow">Guide rapide de la base</p>
          <p id="page-copy" class="intro__copy">Compare l’efficacité de chaque niveau d’aptitude, de 1 à 10.</p>
        </div>
      </section>

      <nav id="job-picker" class="job-picker" aria-label="Choisir une aptitude"></nav>
      <section id="content" aria-live="polite"></section>

      <footer>
        Données Palworld 1.0.3 · Interface communautaire non affiliée à Pocketpair · <a href="LICENSE">GPL-3.0</a>.
      </footer>
    </main>
  </body>
</html>
